     shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="finGradient" x1="235" y1="856" x2="740" y2="278"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24b89d"/>
      <stop offset="48%" stop-color="#38c2b1"/>
      <stop offset="100%" stop-color="#57cbc0"/>
    </linearGradient>

    <linearGradient id="bodyGradient" x1="336" y1="938" x2="1024" y2="602"

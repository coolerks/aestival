      <stop offset="31%" stop-color="#08a5df"/>
      <stop offset="61%" stop-color="#0598dd"/>
      <stop offset="100%" stop-color="#0873d1"/>
    </linearGradient>

    <linearGradient id="lightWaveGradient" x1="526" y1="713" x2="847" y2="603"

      <feOffset dy="3" result="offset"/>
      <feColorMatrix in="offset" type="matrix"
        values="0 0 0 0 0.02
                0 0 0 0 0.24
                0 0 0 0 0.34
                0 0 0 .10 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

